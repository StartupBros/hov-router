# Builds HoV Router from this checkout; no prebuilt image is published.
#   docker compose up -d --build
services:
  # Service, container and volume names keep the pre-rename "better-ccflare"
  # on purpose. Compose names the real volume <project>_better-ccflare-data,
  # and the project defaults to this directory's name; docs/docker.md covers
  # moving an existing install. The backup commands rely on the fixed
  # container name, and a second name would collide on port 8080.
  better-ccflare:
    build: .
    image: hov-router:local
    container_name: better-ccflare
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Persist database
      - better-ccflare-data:/data
      # Optional: mount custom config
      # - ./config:/app/config:ro
    environment:
      - NODE_ENV=production
      - BETTER_CCFLARE_DB_PATH=/data/better-ccflare.db
      - XDG_CONFIG_HOME=/data
      # Optional: configure logging
      # - LOG_LEVEL=info
      # Optional: expose per-account detail on /health?detail=1 (default: off)
      # - HEALTH_DETAIL_ENABLED=false
    # Optional .env file next to this compose file; compose starts without it.
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Resource limits (adjust as needed)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

volumes:
  better-ccflare-data:
    driver: local
