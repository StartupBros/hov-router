name: Managed Routing Foundation Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  managed-routing-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Exact version from .bun-version, the single source of truth for every
          # workflow that installs Bun (#321). `latest` moved underneath this gate
          # once (#231/#232) and the unpin in #319 reopened that exposure, so a
          # bump is a deliberate edit to .bun-version (procedure:
          # docs/contributing.md, "Bumping the Bun toolchain").
          bun-version-file: .bun-version

      - name: Verify the installed Bun matches .bun-version
        # setup-bun only warns and falls back to `latest` if the file is missing.
        run: test "$(bun --version)" = "$(tr -d '[:space:]' < .bun-version)"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build CLI generated modules
        run: bun run build:cli

      - name: Build dashboard generated modules
        run: bun run build:dashboard

      - name: Run focused managed-routing database tests
        run: >-
          bun test
          packages/database/src/__tests__/managed-routing-migrations.test.ts
          packages/database/src/adapters/__tests__/bun-sql-adapter-batch.test.ts
          packages/database/src/repositories/__tests__/combo-managed-policy.test.ts
          packages/database/src/repositories/__tests__/combo-priority.test.ts

      - name: Run full test suite
        run: |
          for root in apps packages scripts tests; do
            if [[ ! -d "$root" ]]; then
              echo "::error::Test root is missing: $root"
              exit 1
            fi
          done

          mapfile -d '' -t test_files < <(
            find apps packages scripts tests -type f \
              \( -name '*.test.ts' -o -name '*.test.tsx' -o -name '*.spec.ts' -o -name '*.spec.tsx' \) \
              -print0 | LC_ALL=C sort -z
          )

          if (( ${#test_files[@]} == 0 )); then
            echo "::error::No test files found"
            exit 1
          fi

          echo "Running ${#test_files[@]} test files in isolated Bun processes"
          failures=()
          for test_file in "${test_files[@]}"; do
            printf '\n==> %s\n' "$test_file"
            if ! bun test --timeout 15000 "$test_file"; then
              failures+=("$test_file")
            fi
          done

          if (( ${#failures[@]} > 0 )); then
            printf '\n::error::%d isolated test file(s) failed\n' "${#failures[@]}"
            printf '  %q\n' "${failures[@]}"
            exit 1
          fi

          printf '\nAll %d isolated test files passed\n' "${#test_files[@]}"

      - name: Run lint
        run: bun run lint

      - name: Run typecheck
        run: bun run typecheck

      - name: Strictly typecheck release scripts (root typecheck excludes scripts and tests)
        run: >-
          bun x tsc --noEmit --ignoreConfig --strict --skipLibCheck
          --target esnext --module esnext --moduleResolution bundler --types bun
          scripts/router-release.ts scripts/router-release-assets.ts
          scripts/__tests__/router-release.test.ts
          scripts/__tests__/router-release-workflow.test.ts

      - name: Run format
        run: bun run format

      - name: Verify lint and format left the checkout clean
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"
